services:
  nexvion:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexvion-ecoomerce:1.0
    container_name: nexvion-container-c
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
